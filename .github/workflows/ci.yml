name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: JavaFX client (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate database schema, seeds and generated ER document
        run: |
          python3 tools/db/checkSchema.py
          python3 tools/db/generateErDoc.py --check

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve dependencies
        run: mvn -B -ntp -Dstyle.color=never dependency:go-offline

      - name: Glyph inventory (diagnostics)
        continue-on-error: true
        run: |
          set +e
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          javap -classpath "$(cat cp.txt)" de.jensd.fx.glyphs.fontawesome.FontAwesomeIcon > fa-icons.txt 2>&1
          echo "glyphs captured: $(wc -l < fa-icons.txt)"

      - name: Compile and run tests (headless JavaFX via Xvfb)
        run: |
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" \
            mvn -B -ntp -Dstyle.color=never verify > desktop-build.log 2>&1
          code=$?
          echo "" >> desktop-build.log
          echo "EXIT_CODE=$code" >> desktop-build.log
          exit $code

      - name: Publish report
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-report.sh desktop desktop-build.log fa-icons.txt target/surefire-reports target/screenshots
