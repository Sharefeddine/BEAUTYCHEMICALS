# ---------------------------------------------------------------------------
# ChemManager ERP - client configuration
# Any key can be overridden with a JVM system property, e.g.
#   java -Ddata.mode=API -Dapi.base.url=http://192.168.1.20/api -jar chemmanager-erp.jar
# or with the environment variables CHEMMANAGER_DATA_MODE / CHEMMANAGER_API_URL.
# ---------------------------------------------------------------------------

app.name=ChemManager ERP
app.version=1.0.0
app.development=true

# Defaults used on first launch (the user can change them in Settings)
app.currency=DZD
app.default.locale=fr
app.theme=LIGHT

# MOCK  : offline demo dataset (no backend needed)
# API   : PHP REST backend only
# AUTO  : probe the backend, fall back to MOCK when unreachable
data.mode=MOCK
api.base.url=http://localhost:8080/api
api.timeout.seconds=20
